name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check console and capture script syntax
        run: |
          for f in console/*.js console/components/*.js scripts/*.mjs; do
            node --check "$f"
          done
      - name: Test console import and rendering safety
        run: node --test tests/test_console_security.cjs

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run Python tests
        run: python -m pytest tests/ -v

  bash-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bash syntax
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
            echo "✓ $f"
          done
